# ──────────────────────────────────────────────────────────────
#  ReachInbox – Local Infrastructure
#  Services: PostgreSQL 16 + Redis 7
#  Both use named volumes so data survives container restarts.
# ──────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5433 -> avoid clashing with another local Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reachinbox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - reachinbox_net

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: unless-stopped
    # Enable AOF persistence so Redis state (BullMQ jobs) survives restarts
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      # Host 6380 -> avoid clashing with another local Redis on 6379
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reachinbox_net

# ──────────────────────────────────────────────────────────────
#  Named volumes (data persists across `docker compose down`)
#  Use `docker compose down -v` only if you want to wipe everything.
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: reachinbox_postgres_data
  redis_data:
    name: reachinbox_redis_data

networks:
  reachinbox_net:
    name: reachinbox_net
    driver: bridge
